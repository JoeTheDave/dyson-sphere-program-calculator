name: CI/CD
on:
  push:
    branches:
      - master

jobs:
  build-test-deploy:
    name: Build, Test & Deploy
    runs-on: ubuntu-latest
    concurrency: deploy-group
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Report runtime versions
        run: |
          node --version
          npm --version
          node -p "'vitest ' + require('./node_modules/vitest/package.json').version"
          node -p "'rolldown ' + (() => { try { return require('./node_modules/rolldown/package.json').version } catch { return 'not installed' } })()"
          node -p "'@tailwindcss/oxide ' + require('./node_modules/@tailwindcss/oxide/package.json').version"

      - name: Ensure oxide native binding
        run: npm install --no-save @tailwindcss/oxide-linux-x64-gnu@$(node -p "require('./node_modules/@tailwindcss/oxide/package.json').version")

      - name: Verify oxide native binding loads
        run: node -e "require('@tailwindcss/oxide'); console.log('oxide ok')"

      - name: Ensure rolldown native binding
        run: npm install --no-save @rolldown/binding-linux-x64-gnu@$(node -p "require('./node_modules/rolldown/package.json').version")

      - name: Verify rolldown native binding loads
        run: node -e "require('@rolldown/binding-linux-x64-gnu'); console.log('rolldown ok')"

      - name: Build
        run: npm run build

      - name: Run unit tests
        run: npm test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
